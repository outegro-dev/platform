name: CI

on:
  pull_request:
  push:
    branches: [master]
    # Documentation alone changes no image: no rebuild, no rollout.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".claude/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Integration tests start PostgreSQL, Valkey and RabbitMQ in Docker.
      - run: pnpm test
      - run: pnpm build

  images:
    name: Images to GHCR
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/bake-action@v6
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        with:
          source: .
          files: docker-bake.hcl
          push: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
            *.labels.org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    name: Release to production (gitops)
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Stays a no-op until the gitops deploy key is configured.
      - id: key
        env:
          KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}
        run: echo "present=$([ -n "$KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: outegro-dev/gitops
          ref: master
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
      - if: steps.key.outputs.present == 'true'
        env:
          TAG: ${{ needs.images.outputs.tag }}
        run: |
          for app in landing-web id-web auth-backend notifications-backend; do
            yq -i "(.images[] | select(.name == \"outegro/$app\")) |= (.newName = \"ghcr.io/outegro-dev/$app\" | .newTag = \"$TAG\")" apps/production/kustomization.yaml
          done
          git config user.name "Nick Lukashik"
          git config user.email "coping.barrel@gmail.com"
          git commit -am "deploy(platform): $TAG"
          git push
