name: CI

on:
  pull_request:
  push:
    branches: [master]
    # Documentation alone changes no image: no rebuild, no rollout.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".claude/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # tools/ci/scope.mjs reads the last green run of this workflow.
  actions: read

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      apps: ${{ steps.scope.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The scope step diffs against the previous master (or the PR base).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # Only the changed packages and their dependents are checked and rebuilt;
      # a change outside apps/ and packages/ checks everything (tools/ci/scope.mjs).
      # On master the diff starts at the last released (green) push, not the
      # previous one: a failed run releases nothing.
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: node tools/ci/scope.mjs
      - run: pnpm lint
      - run: pnpm turbo run typecheck ${{ steps.scope.outputs.filter }}
      # Integration tests start PostgreSQL, Valkey and RabbitMQ in Docker.
      - run: pnpm turbo run test ${{ steps.scope.outputs.filter }}
      - run: pnpm turbo run build ${{ steps.scope.outputs.filter }}

  images:
    name: Images to GHCR
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.check.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      digests: ${{ steps.digests.outputs.digests }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        env:
          APPS: ${{ needs.check.outputs.apps }}
        run: |
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "targets=$(echo "$APPS" | jq -r 'join(",")')" >> "$GITHUB_OUTPUT"
          echo "build_apps=$(echo "$APPS" | jq -r 'join(" ")')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: bake
        uses: docker/bake-action@v6
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        with:
          source: .
          files: docker-bake.hcl
          targets: ${{ steps.tag.outputs.targets }}
          push: true
          set: |
            *.args.BUILD_APPS=${{ steps.tag.outputs.build_apps }}
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
            *.labels.org.opencontainers.image.revision=${{ github.sha }}
      # { "<app>": "sha256:…" } of what was just pushed: gitops pins it.
      - id: digests
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          digests=$(echo "$METADATA" | jq -c 'with_entries(.value = .value["containerimage.digest"])')
          echo "$digests" | jq .
          echo "digests=$digests" >> "$GITHUB_OUTPUT"

  deploy:
    name: Release to production (gitops)
    needs: [check, images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Stays a no-op until the gitops deploy key is configured.
      - id: key
        env:
          KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}
        run: echo "present=$([ -n "$KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: outegro-dev/gitops
          ref: master
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
      - if: steps.key.outputs.present == 'true'
        env:
          TAG: ${{ needs.images.outputs.tag }}
          APPS: ${{ needs.check.outputs.apps }}
          DIGESTS: ${{ needs.images.outputs.digests }}
        # Only the rebuilt apps move; the rest keep the image they run. The
        # image is pinned as <tag>@<digest>: the tag stays readable, and a tag
        # pushed again later cannot change what runs (immutable release). An
        # app joins by adding its images entry in gitops (and its target to
        # docker-bake.hcl and tools/ci/scope.mjs).
        run: |
          for app in $(echo "$APPS" | jq -r '.[]'); do
            digest=$(echo "$DIGESTS" | jq -r --arg app "$app" '.[$app] // empty')
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "no digest for $app" >&2
              exit 1
            fi
            APP="$app" REF="$TAG@$digest" yq -i '(.images[] | select(.name == "outegro/" + strenv(APP))) |= (.newName = "ghcr.io/outegro-dev/" + strenv(APP) | .newTag = strenv(REF))' apps/production/kustomization.yaml
          done
          git config user.name "Nick Lukashik"
          git config user.email "coping.barrel@gmail.com"
          git commit -am "deploy(platform): $TAG ($(echo "$APPS" | jq -r 'join(", ")'))"
          git push
