<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Acme - Apply (silent fixture)</title>
</head>
<body>
<form id="application-form" class="application-form" novalidate>
  <ul>
    <li><label><div>Full name<span class="required">✱</span></div><input type="text" name="name" required></label></li>
    <li><label><div>Email<span class="required">✱</span></div><input type="email" name="email" required></label></li>
  </ul>
  <button id="btn-submit" type="submit">Submit application</button>
</form>
<script>
  window.submitCount = 0;
  document.getElementById("application-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    window.submitCount++;
    window.atelierFixtureReport?.("submitCount", window.submitCount);
    // The server takes the request and the page shows nothing: no thanks, no error.
    await fetch("/silent/applications", { method: "POST", body: "{}"});
  });
</script>
</body>
</html>
