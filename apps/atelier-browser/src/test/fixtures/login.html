<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in - Acme Careers (login wall fixture)</title>
</head>
<body>
<main>
  <h1>Sign in to apply</h1>
  <p>You must be logged in to apply for this position. New here? Create an account to apply.</p>
  <form id="login-form">
    <label for="login-email">Email</label>
    <input id="login-email" type="email" name="email">
    <label for="login-password">Password</label>
    <input id="login-password" type="password" name="password">
    <button type="submit">Sign in</button>
  </form>
</main>
</body>
</html>
