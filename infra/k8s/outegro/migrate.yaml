# One migration Job per service and release; the new version rolls out only
# after both complete. Migrations get the database URL and nothing else.
apiVersion: batch/v1
kind: Job
metadata:
  name: auth-migrate-${TAG}
  namespace: outegro
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: outegro/auth-backend:${TAG}
          imagePullPolicy: Never
          command: ["node", "dist/db/migrate.js"]
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-auth
                  key: password
            - name: DATABASE_URL
              value: postgres://auth:$(DB_PASSWORD)@pg-rw:5432/auth
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
