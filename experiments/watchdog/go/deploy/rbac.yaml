# EXAMPLE ONLY - not applied anywhere. Shadow run of the Go watchdog next to
# the shell CronJob (gitops apps/production/watchdog.yaml).
#
# Same read-only cluster access as the shell watchdog, under its own names
# so the shadow can be removed without touching the production one.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: watchdog-go
  namespace: outegro
  labels:
    app.kubernetes.io/name: watchdog-go
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: outegro-watchdog-go
  labels:
    app.kubernetes.io/name: watchdog-go
rules:
  - apiGroups: [""]
    resources: [pods, nodes]
    verbs: [get, list]
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [get, list]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters, backups]
    verbs: [get, list]
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: outegro-watchdog-go
  labels:
    app.kubernetes.io/name: watchdog-go
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: outegro-watchdog-go
subjects:
  - kind: ServiceAccount
    name: watchdog-go
    namespace: outegro
---
# The state ConfigMap. "create" cannot be limited by name in RBAC; the
# other verbs only reach watchdog-state-v2. The Go code reads (get) and
# writes (update) it and never patches, so patch is not granted. In DRY_RUN
# only get is used.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: watchdog-go-state
  namespace: outegro
  labels:
    app.kubernetes.io/name: watchdog-go
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [watchdog-state-v2]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: watchdog-go-state
  namespace: outegro
  labels:
    app.kubernetes.io/name: watchdog-go
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: watchdog-go-state
subjects:
  - kind: ServiceAccount
    name: watchdog-go
    namespace: outegro
