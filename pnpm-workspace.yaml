packages:
  - apps/*
  - packages/*
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  cpu-features: false
  esbuild: true
  protobufjs: false
  sharp: false
  ssh2: false
minimumReleaseAgeExclude:
  - '@testcontainers/postgresql@12.2.0'
  - testcontainers@12.2.0
  - '@testcontainers/rabbitmq@12.2.0'
  - '@testcontainers/valkey@12.2.0'
  - amqplib@2.2.0
  - '@nestjs/cli@12.0.8'
onlyBuiltDependencies:
  - sharp
  - '@tailwindcss/oxide'

